# dev-mac is the only profile. Models load only on explicit live/replay start.
profile = "dev-mac"

# Microphone consumer: exact unique name preferred, unique substring accepted.
# Default empty/no index fails live startup. Use the actual OS device name.
input_device_name = "YOUR MICROPHONE NAME"
# input_device_index = 1  # Optional nonnegative index if name is empty.

# Playback consumer: empty means system default output; otherwise unique name.
output_device_name = ""

# Capture echo gate: false rejects overlap with Rex playback and 300 ms tail.
# Set true only for an actually isolated headset/test setup. No AEC is implemented.
echo_isolated = false

# Silero speech probability threshold, valid .01-.99; needs room calibration.
vad_threshold = 0.5
# Endpoint silence, valid .2-2 seconds. Mic preroll is fixed at 256 ms.
# Allows thinking pauses; the conversation model can also wait on unfinished thoughts.
end_silence_seconds = 1.2
# Qwen quality flag only, valid -5..0. This is not speaker identity confidence.
asr_trust_logprob = -0.35

# Optional camera: explicit AVFoundation device name. No fallback to an index.
# Normally enable for a test using `live --camera`; no camera in doctor or replay.
camera_enabled = false
camera_device_name = ""

# Conversation worker: consider a lull after this much silence and completed work.
# Default 8 seconds for social demos; valid 3-120. Requires --camera and a stable
# visible audience. The same LLM may stay quiet; this is not a speech interval.
proactive_lull_seconds = 8.0

# Optional live WAV retention for human labeling. Accepted enrollment audio is
# always kept atomically in the core DB; this retains all endpointed test captures.
record_evaluation = false

# Proactive scene snapshots: only active with --camera. Sends up to two small
# images to the existing hosted conversation model during an opportunity.
# Images are not written to logs/history. Disable to keep camera pixels local.
scene_observations_enabled = true

# Top headline RSS feeds, at most four HTTPS URLs. Empty [] disables news.
# Used only with camera-enabled live participation; refreshed outside the turn loop.
news_feed_urls = ["https://feeds.bbci.co.uk/news/rss.xml"]

# Sacramento, CA, per the user's requested weather location. No geolocation lookup.
# Open-Meteo current conditions, Fahrenheit/mph/inches; no credential required.
weather_enabled = true
weather_location = "Sacramento, CA"
weather_latitude = 38.5816
weather_longitude = -121.4944
