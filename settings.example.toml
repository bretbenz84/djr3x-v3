# dev-mac is the only profile. Models load only on explicit live/replay start.
profile = "dev-mac"

# Microphone consumer: exact unique name preferred, unique substring accepted.
# Default empty/no index fails live startup. Use the actual OS device name.
input_device_name = "YOUR MICROPHONE NAME"
# input_device_index = 1  # Optional nonnegative index if name is empty.

# Playback consumer: empty means system default output; otherwise unique name.
output_device_name = ""

# Capture echo gate: false rejects overlap with Rex playback and 300 ms tail.
# Set true only for an actually isolated headset/test setup. No AEC is implemented.
echo_isolated = false

# standard: first mono channel; respeaker-flex: open channels 0–1, select only
# validated Conference/AEC channel 0. Flex requires the same named input/output.
microphone_mode = "standard"
# Saturating host gain (.1–4); V2's validated Flex setup uses 1.5.
input_gain = 1.0
# Read-only USB direction polling; requires respeaker-flex and USB dependencies.
# Array-relative evidence only; no movement or camera-bearing calibration.
direction_enabled = false

# Silero speech probability threshold, valid .01-.99; needs room calibration.
vad_threshold = 0.5
# Endpoint silence, valid .2-2 seconds. Mic preroll is fixed at 256 ms.
# 0.35 s (owner choice, October 16; 0.7 s covered an average thinking pause). Speech that
# resumes before the reply is audible cancels it, and the model can wait on unfinished thoughts.
end_silence_seconds = 0.35
# Qwen quality flag only, valid -5..0. This is not speaker identity confidence.
asr_trust_logprob = -0.35

# Optional camera: explicit AVFoundation device name. No fallback to an index.
# Normally enable for a test using `live --camera`; no camera in doctor or replay.
camera_enabled = false
camera_device_name = ""
# Capture mode must be supported by the selected camera; no automatic fallback.
# Width: even 320–1920; height: even 240–1080; frame rate: 1–120.2 fps.
# Robot HD USB Camera uses 1920x1080 at 30.00003; defaults preserve dev-Mac mode.
# Face analysis remains capped at 2 fps independently of capture.
camera_width = 1280
camera_height = 720
camera_framerate = 30.0

# Conversation worker: consider a lull after this much silence and completed work.
# Default 5-second lull floor for plan advancement; valid 3-120. No camera/face required.
# (8 seconds until October 3, when the owner found Rex's own pacing too slow.)
# Saved plan step delays also apply; model/TTS time adds to this eligibility interval.
proactive_lull_seconds = 5.0

# Optional live WAV retention for human labeling. Accepted enrollment audio is
# always kept atomically in the core DB; this retains all endpointed test captures.
record_evaluation = false

# Shared scene snapshots: only active with --camera. Sends up to two small
# images during proactive opportunities, or one for tool-selected current-view
# questions. False disables both image-upload paths.
# Images are not written to logs/history. Disable to keep camera pixels local.
scene_observations_enabled = true

# Top headline RSS feeds, at most four HTTPS URLs. Empty [] disables news.
# Available in live participation with or without a camera; refreshed outside the turn loop.
news_feed_urls = ["https://feeds.bbci.co.uk/news/rss.xml"]

# Once a day a hosted web search picks about five concrete, varied stories (V2's daily
# "things I heard about"), and people's stated interests get up to four topic searches a
# day while they are here. Paid OpenAI web searches, about 1 cent each; cached in
# local/cache/news.json so a same-day restart does not search again. false disables both.
news_search_enabled = true

# Sacramento, CA, per the user's requested weather location. No geolocation lookup.
# Open-Meteo current conditions, Fahrenheit/mph/inches; no credential required.
weather_enabled = true
weather_location = "Sacramento, CA"
weather_latitude = 38.5816
weather_longitude = -121.4944

# Named pet/object photographic memory, with one shared RF-DETR Nano ONNX pass
# every 1.5 seconds. Requires --camera and prepared local/models/objects weights.
# Selective OpenAI image comparisons; PNG photos and JSON catalog are ordinary
# files under local/visual-memory/. This upload choice is separate from scenes.
object_memory_enabled = false

# Room recognition (V2's MobileCLIP-S2 place model, run locally with ONNX): Rex knows which
# room he is in, asks what an unfamiliar room is called and remembers which rooms he has
# moved between. One local embedding every 1.5 s; no image leaves the robot for this.
# Requires --camera and local/models/places/mobileclip-s2.onnx (tools/export_place_model.py).
place_recognition_enabled = false

# Voice impressions ("do an impression of Jimmy Carter", "impersonate me", and rare
# surprise cameos when a listed person comes up). The model writes the parody and chooses
# the voice; the local Breeze TTS 2 engine clones it from assets/voices/famous clips or
# from accepted enrollment recordings. Requires tools/prepare_voice_cloning.py (about
# 4.6 GB of weights, loaded on first use and released after ten idle minutes).
impersonation_enabled = true
# Optional physical servos. Empty by default; requires operator handoff. Servos off
# after a power-down are held at their unpowered rest first. No port auto-detection.
servo_port = ""

# Optional LED boards: each empty value disables that zone. Explicit /dev/cu.*
# paths must differ from each other and the Maestro. No discovery or reconnect.
# Consumed by live LED lifecycle/output and exclusive controller handoff.
head_led_port = ""
chest_led_port = ""

# Optional drive base (V2 ESP32 firmware, unchanged). Empty disables wheels.
# Explicit /dev/cu.* path, distinct from other ports; the V2 battery menu app
# yields it through the controller handoff. Connecting never moves the base.
# Consumed by live drive_base tool, back-off reflex and handoff. Robot: /dev/cu.usbserial-110
drive_port = ""

# Optional LD2450 radar ring; requires drive_port. A bearing prior for where to
# look, never identity. Consumed by drive targets, find_person and unseen-presence
# opportunities. Robot: /dev/cu.usbmodem2301 (USB serial 28:84:85:4D:1C:80).
radar_port = ""

# Stronger model for private, persisted narrative/activity plans at lulls.
# Replies and plan-step execution continue to use GPT-6 Luna. No silent fallback.
agency_planner_model = "gpt-5.6-terra"

# Writer's room: after a reply the planner model may write two or three optional joke angles
# that the next reply can use. Never delays a reply; at most every 45 s and 30 calls an hour.
joke_writer_enabled = true
